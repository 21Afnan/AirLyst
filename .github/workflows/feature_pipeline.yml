name: Scheduled Feature Pipeline

on:
  schedule:
    # Runs daily at 00:00 UTC (05:00 Pakistan Time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Feature Pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: "Airlyst"
          HOPSWORKS_HOST: "eu-west.cloud.hopsworks.ai"
          LATITUDE: 33.72
          LONGITUDE: 73.04
          CITY: "Islamabad"
          WEATHER_URL: "https://archive-api.open-meteo.com/v1/archive"
          AIR_URL: "https://air-quality-api.open-meteo.com/v1/air-quality"
          FORECAST_URL: "https://api.open-meteo.com/v1/forecast"
        run: |
          python backend/src/feature_pipeline/run_feature_pipeline.py

      - name: Commit and Push updated features database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backend/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of local features database" && git push)

