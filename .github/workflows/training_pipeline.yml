name: Model Training Tournament

on:
  schedule:
    # Runs weekly on Sundays at 02:00 UTC (07:00 Pakistan Time)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest

    # Add write permissions so that GitHub Actions can commit updated model binaries back to repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Model Tournament & Register
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: "Airlyst"
          HOPSWORKS_HOST: "eu-west.cloud.hopsworks.ai"
          LATITUDE: 33.72
          LONGITUDE: 73.04
          CITY: "Islamabad"
          WEATHER_URL: "https://archive-api.open-meteo.com/v1/archive"
          AIR_URL: "https://air-quality-api.open-meteo.com/v1/air-quality"
          FORECAST_URL: "https://api.open-meteo.com/v1/forecast"
        run: |
          python backend/src/ml/training.py


